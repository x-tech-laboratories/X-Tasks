name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Build the signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release-keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          nix develop .#android --command bash -c '
            npm ci
            npm run build:android
            cd android && ./gradlew assembleRelease
          '
          cp android/app/build/outputs/apk/release/app-release.apk x-tasks.apk
      # Each build gets its own version tag, which Obtainium reads to spot updates.
      - name: Publish it as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" x-tasks.apk --target "$GITHUB_SHA" --latest \
            --title "X-Tasks for Android 1.0.${{ github.run_number }}" \
            --notes "Built from $GITHUB_SHA."
